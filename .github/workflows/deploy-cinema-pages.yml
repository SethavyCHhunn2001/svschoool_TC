name: Deploy CINÉMA to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/cinema-flutter-mongodb
    paths:
      - ".github/workflows/deploy-cinema-pages.yml"
      - "cinema_app/mobile/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cinema-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: cinema_app/mobile/pubspec.lock

      - name: Install Flutter dependencies
        working-directory: cinema_app/mobile
        run: flutter pub get

      - name: Analyze and test
        working-directory: cinema_app/mobile
        run: |
          flutter analyze
          flutter test

      - name: Build Flutter web
        working-directory: cinema_app/mobile
        env:
          CINEMA_API_BASE_URL: ${{ vars.CINEMA_API_BASE_URL }}
        run: |
          api_base_url="${CINEMA_API_BASE_URL:-https://cinema-api.example.invalid/api}"
          flutter build web \
            --release \
            --base-href "/svschoool_TC/" \
            --dart-define="API_BASE_URL=${api_base_url}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cinema_app/mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
